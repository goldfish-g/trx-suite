    <!-- For browsers without JavaScript, and crawlers that read the page as sent. -->
    <noscript>
      <main style="max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; color: #e8dcc0; font: 17px/1.55 Georgia, serif">
        <h1>Tombs Nexus</h1>
        <p>
          Play TRLE custom levels and Tomb Raider I, II, III and IV with their Gold expansions online, in your browser,
          on the <a style="color: #f0a33c" href="https://github.com/LostArtefacts/TRX">TRX</a> engine. It installs as an app
          and, once a game is downloaded, plays without a connection.
        </p>
        <p><strong>Tombs Nexus needs JavaScript and WebGL.</strong> Turn JavaScript on, or open it in a recent browser.</p>
        <h2>The games</h2>
        <ul>
          <li>
            Tomb Raider (1996), Tomb Raider II (1997), Tomb Raider III (1998), The Last Revelation (1999) and The Lost Artifact
            (2000): sign in with Steam to download the copies you own, the originals or the Remastered collections, or add the
            files from your own copy.
          </li>
          <li>Unfinished Business (1998) and The Golden Mask (1999): free for everyone.</li>
          <li>
            TRLE custom levels for Tomb Raider I–III from <a style="color: #f0a33c" href="https://trcustoms.org">TRCustoms</a>:
            browse and play them, free, without signing in. Each level belongs to the builder who made it.
          </li>
        </ul>
      </main>
    </noscript>
